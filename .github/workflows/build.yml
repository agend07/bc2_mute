name: Build BC2 Chat Filter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build msimg32.dll and package ZIP
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: bc2-chat-filter-windows
          path: |
            dist/bc2-chat-filter-windows.zip
            dist/msimg32.dll
            dist/SHA256.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bc2-chat-filter-windows
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "BC2 Chat Filter $TAG" --notes "Client-side chat filter and mute list (`msimg32.dll`) for Battlefield: Bad Company 2. Extract `msimg32.dll` next to `BFBC2Game.exe`. See README.md for usage (`/mute`, `/unmute`, `/mutelist`)." release/bc2-chat-filter-windows.zip release/SHA256.txt
